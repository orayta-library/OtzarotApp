name: Build OtzarotApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore OtzarotApp/OtzarotApp.csproj

    - name: Create test certificate
      run: |
        $cert = New-SelfSignedCertificate `
          -Type CodeSigningCert `
          -Subject "CN=Developer" `
          -KeyUsage DigitalSignature `
          -FriendlyName "OtzarotApp Test" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        $thumb = $cert.Thumbprint
        echo "CERT_THUMBPRINT=$thumb" >> $env:GITHUB_ENV

    - name: Build MSIX
      run: |
        msbuild OtzarotApp/OtzarotApp.csproj `
          /p:Platform=x64 `
          /p:Configuration=Release `
          /p:GenerateAppxPackageOnBuild=true `
          /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT `
          /p:AppxPackageSigningEnabled=true `
          /nologo

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OtzarotApp
        path: OtzarotApp/bin/x64/Release/net9.0-windows10.0.22621.0/AppPackages/
